# Public roadmap. Status values: DONE, IN PROGRESS, PLANNED.
phases:
  - id: hackmeridian
    name: HackMeridian
    status: IN PROGRESS
    summary: >
      Scale-track work for HackMeridian 2026. Application scope named
      OpenZeppelin, Trustless Work, and path payments; after mentor and
      judge conversations the event priority is production readiness.
    items:
      - Whole-work sale on contract version v3
      - Fix USDC purchases and recover locked units
      - Index offers and listings; automatic distribution to holders
      - Role permissions and verification improvements
      - Fourth external QA pass
      - Stellar mainnet launch
  - id: phase-1
    name: Phase 1
    status: PLANNED
    summary: >
      A smart wallet in the web app, so a visitor can sign without a
      browser extension.
    items:
      - Smart wallet with passkeys on the web
  - id: phase-2
    name: Phase 2
    status: PLANNED
    summary: >
      Native applications that sign with the device biometric.
    items:
      - iOS app with biometric signing
      - Android app with biometric signing
  - id: phase-3
    name: Phase 3
    status: PLANNED
    summary: >
      Institutional hardening after the HackMeridian mainnet launch.
    items:
      - Legal review of participations
      - Contract audit
      - Institutional custody
      - Separate platform and validator accounts, each with a multisig
      - OpenZeppelin contracts where they fit the product
      - Trustless Work escrow for physical-delivery sales
      - Path payments for any-asset checkout
  - id: phase-4
    name: Phase 4
    status: PLANNED
    summary: >
      First institutions on mainnet, with fiat ramps and a public index.
    items:
      - Pilots with museums and foundations
      - Ramps through Stellar anchors
      - Public indexer
