# Public project accounts. The generator checks platform and validator
# against the active contract registry. Do not put secret keys in this file.
networks:
  testnet:
    accounts:
      - id: platform
        registryField: platform
        role: Platform
        address: GBYYRWRRF4PNJJMZGE2Q5HUOCPSU3Y4WCTWJ3BQFFNUO3YIPOAD7A357
        purpose: >
          Assigns on-chain roles and is the account that receives the
          certification fee (5 XLM or 1 USDC on Testnet).
      - id: validator
        registryField: validator
        role: Validator
        address: GBYYRWRRF4PNJJMZGE2Q5HUOCPSU3Y4WCTWJ3BQFFNUO3YIPOAD7A357
        purpose: >
          Co-signs certification. On the Testnet deployment this was the
          same account as the platform. Roadmap phase 3 separates the two
          accounts and places each behind a multisig.
      - id: demo-museum
        role: Demo museum (QA)
        address: GB7XRDD2A5AMOJVGMEZ4M7DIS3CSPQRP3FMRRPUDJ46XFGO4AFJ4QXFV
        purpose: >
          Public demo account with the museum role on Testnet. Also used as
          QA-5 on mainnet (same Freighter pubkey).
      - id: demo-seed-org
        role: Demo organization (seed)
        address: GAJT4VFXWBD2QXJNOBQBY6TKTFEPO5YYHQXBCBIOCC7TGW6YAGDSMERC
        purpose: >
          Public demo organization wallet that published Testnet participation
          offers and the secondary listing on Silencio blanco.
  mainnet:
    status: LIVE
    reason: >
      public app on Stellar mainnet (api 0.17.2 / web 0.4.22, registry mainnet-v1);
      seed hackathon-scale-15-v6-mainnet live
    accounts:
      - id: platform-mainnet
        registryField: platform
        role: Platform
        address: GCNSEGPV3MS36RO7TT4OE7UEVWLLVSOGDRHURZRUHPRKQRCJ2QC32Q3V
        purpose: >
          Mainnet platform / deployer and the live `/api/meta` platformWallet.
          Circle USDC trustline opened
          ([tx](https://stellar.expert/explorer/public/tx/a9df809b9748f309b720ff3aad0e86bc8c82c591af9dc085830326436b807118)).
          Deployed the HackMeridian mainnet contract set (38 txs, ~88 XLM).
      - id: validator-mainnet
        registryField: validator
        role: Validator
        address: GCNSEGPV3MS36RO7TT4OE7UEVWLLVSOGDRHURZRUHPRKQRCJ2QC32Q3V
        purpose: >
          Co-signs certification on mainnet. Same account as the platform today;
          phase 3 separates the two behind multisig.
      - id: qa1-artist-mainnet
        role: QA-1 artist (Freighter)
        address: GCPGMC55DFBJBOPRXZ7MZ6ZJU5GLAJLB5DXNIQS3RNKIKKXZN3YCH3RL
        purpose: >
          Public Freighter account with the artist role on mainnet (seed
          hackathon-scale-15-v6-mainnet). Same pubkey as Testnet QA-1.
      - id: qa4-connoisseur-mainnet
        role: QA-4 connoisseur (Freighter)
        address: GAJGJCAQFRQQX2PE4KYVC6STKIYBZZTNYN4BIVP73MSYNYJLW7ZCYT54
        purpose: >
          Public Freighter account with the connoisseur role on mainnet.
      - id: qa5-museum-mainnet
        role: QA-5 museum (Freighter)
        address: GB7XRDD2A5AMOJVGMEZ4M7DIS3CSPQRP3FMRRPUDJ46XFGO4AFJ4QXFV
        purpose: >
          Public Freighter account with the museum role on mainnet; Demo Museum
          (QA) org admin.
