# Public project accounts. The generator checks platform and validator
# against the active contract registry. Do not put secret keys in this file.
networks:
  testnet:
    accounts:
      - id: platform
        registryField: platform
        role: Platform
        address: GBYYRWRRF4PNJJMZGE2Q5HUOCPSU3Y4WCTWJ3BQFFNUO3YIPOAD7A357
        purpose: >
          Assigns on-chain roles and is the account that receives the
          certification fee (5 XLM or 1 USDC on Testnet).
      - id: validator
        registryField: validator
        role: Validator
        address: GBYYRWRRF4PNJJMZGE2Q5HUOCPSU3Y4WCTWJ3BQFFNUO3YIPOAD7A357
        purpose: >
          Co-signs certification. On the current Testnet deployment this is the
          same account as the platform. Roadmap phase 3 separates the two
          accounts and places each behind a multisig.
      - id: demo-museum
        role: Demo museum (QA)
        address: GB7XRDD2A5AMOJVGMEZ4M7DIS3CSPQRP3FMRRPUDJ46XFGO4AFJ4QXFV
        purpose: >
          Public demo account with the museum role. It is the institution
          signature on a deceased-author certificate, and the Freighter
          account used for museum QA steps.
      - id: demo-seed-org
        role: Demo organization (seed)
        address: GAJT4VFXWBD2QXJNOBQBY6TKTFEPO5YYHQXBCBIOCC7TGW6YAGDSMERC
        purpose: >
          Public demo organization wallet that published the demo participation
          offers and the secondary listing on Silencio blanco.
  mainnet:
    status: PREP
    reason: platform funded; Artifex contracts not yet deployed
    accounts:
      - id: platform-mainnet
        role: Platform
        address: GCNSEGPV3MS36RO7TT4OE7UEVWLLVSOGDRHURZRUHPRKQRCJ2QC32Q3V
        purpose: >
          Mainnet platform account, created and funded. Circle USDC trustline
          opened
          ([tx](https://stellar.expert/explorer/public/tx/a9df809b9748f309b720ff3aad0e86bc8c82c591af9dc085830326436b807118)).
